plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id "me.modmuss50.mod-publish-plugin" version "2.0.0"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

// LA MAGIE MULTILOADER : Fabric lit directement les sources de common !
sourceSets {
    main {
        java {
            srcDirs += '../common/src/main/java'
        }
        resources {
            srcDirs += '../common/src/main/resources'
        }
    }
}

// CORRECTION 1 : On ignore les fichiers en double lors de la copie des ressources (lang, models...)
tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// CORRECTION 2 : On ignore les fichiers en double lors de la création des archives .jar (sourcesJar, etc.)
tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }

    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

publishMods {
    file = jar.archiveFile
    changelog = providers.fileContents(layout.projectDirectory.file("CHANGELOG.md")).asText.get()
    type = STABLE
    version = "1.0.2-1.21.11"
    modLoaders.add("fabric")
    modLoaders.add("quilt")

    curseforge {
        displayName = file.map { it.asFile.name }
        projectId = "1617359"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        changelogType = "markdown"

        minecraftVersionRange {
            start = "1.21.11"
            end = "1.21.11"
        }

        client = true
        server = false
        requires("fabric-api")
    }

    modrinth {
        displayName = "Grab Villager 1.0.2-1.21.11"
        projectId = "FJX2GwgJ"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")

        minecraftVersionRange {
            start = "1.21.11"
            end = "1.21.11"
        }

        requires("fabric-api")
    }
}