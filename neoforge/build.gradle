plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

// On sécurise la lecture des variables depuis le gradle.properties pour éviter les bugs de Groovy
def neoVersion = rootProject.hasProperty('neoforge_version') ? rootProject.property('neoforge_version') : '21.1.65'
def parchVersion = rootProject.hasProperty('parchment_version') ? rootProject.property('parchment_version') : '2024.11.17'
def parchMc = rootProject.hasProperty('parchment_minecraft') ? rootProject.property('parchment_minecraft') : '1.21.1'
def modId = rootProject.hasProperty('mod_id') ? rootProject.property('mod_id') : 'grabvillager'

neoForge {
    // Spécifie la version de NeoForge à utiliser
    version = neoVersion

    // Application des mappings de traduction Parchment
    parchment {
        mappingsVersion = parchVersion
        minecraftVersion = parchMc
    }

    // Le nouveau système de création des configurations de lancement pour la 1.21
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
        }
        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
            programArgument '--nogui'
        }
    }

    // Déclare ton mod au système
    mods {
        "${modId}" {
            sourceSet sourceSets.main
        }
    }
}

// LA MAGIE MULTILOADER : NeoForge lit directement les sources de common !
sourceSets {
    main {
        java {
            srcDirs += '../common/src/main/java'
        }
        resources {
            srcDirs += '../common/src/main/resources'
        }
    }
}

// CORRECTION 1 : On ignore les fichiers en double lors de la copie des ressources
tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// CORRECTION 2 : On ignore les fichiers en double lors de la création des archives .jar
tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}